<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Driver Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #08233F;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      max-width: 280px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-retry {
      display: none;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="logo-icon.png" alt="Driver Hub" class="logo" onerror="this.style.display='none'">
  <h1>Driver Hub</h1>
  <p id="status-text">Connecting to Driver Hub...</p>
  <div class="spinner" id="spinner"></div>
  <button class="btn-retry" id="btn-retry" onclick="window.location.href='https://driverhub.in'">Retry</button>

  <script>
    setTimeout(function() {
      if (!navigator.onLine) {
        document.getElementById('status-text').innerText = 'No internet connection detected. Please check your connection and retry.';
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('btn-retry').style.display = 'inline-block';
      } else {
        window.location.href = 'https://driverhub.in';
      }
    }, 2000);
  </script>
</body>
</html>
